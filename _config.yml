# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html

# Site
title: HuangR's Blog
subtitle: 记录世界，记录你！
description: 黄锐的个人博客，记录 Python、深度学习与日常。
keywords: Python, 深度学习, CV, NLP
author: 黄锐
language: zh-CN
timezone: Asia/Shanghai

# URL
url: https://ruirui-huang.github.io/
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude:
filename_case: 0
render_drafts: false
post_asset_folder: false
relative_link: false
future: true
highlight:
  enable: true
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false
  preprocess: true
  line_number: true
  tab_replace: ''

# Markdown 渲染器：hexo-renderer-markdown-it + @renbaoshuo/markdown-it-katex（KaTeX 数学公式）
markdown:
  render:
    html: true
    xhtmlOut: false
    breaks: false
    linkify: true
    typographer: false
  plugins:
    - name: '@renbaoshuo/markdown-it-katex'
      options:
        throwOnError: false
        strict: false
  anchors:
    level: [1, 2, 3, 4, 5, 6]
    collisionSuffix: ''
    permalink: false
    case: 0
    separator: '-'

# Home page setting
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Metadata elements
meta_generator: true

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: mtime

# Pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
include:
exclude:
ignore:

# Extensions
theme: next

# Deployment
deploy:
  type: git
  repo: https://github.com/Ruirui-Huang/Ruirui-Huang.github.io.git
  branch: master

# Feed (atom.xml)
feed:
  type: atom
  path: atom.xml
  limit: 20

# Local search (search.xml)
search:
  path: search.xml
  field: post
  content: true
  format: html
